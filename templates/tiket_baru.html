{% extends 'base.html' %}{% block title %}Buat Laporan{% endblock %}
{% block body %}<div class="card narrow wide"><h1>Formulir Laporan Gangguan</h1>
<form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">
<label>Judul laporan<input name="judul" maxlength="150" required value="{{ f.get('judul','') }}"></label>
<label>Kategori<select name="kategori_id" required><option value="">Pilih kategori</option>{% for k in kat %}<option value="{{ k.id }}" {{ 'selected' if f.get('kategori_id','')|string==k.id|string }}>{{ k.nama }}</option>{% endfor %}</select></label>
<label>Deskripsi gangguan<textarea name="deskripsi" rows="6" maxlength="3000" required>{{ f.get('deskripsi','') }}</textarea></label>
<button class="btn">Kirim laporan</button></form></div>{% endblock %}
